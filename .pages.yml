# Panel de edición del sitio (Pages CMS): https://app.pagescms.org
# Cada cambio guardado en el panel se registra en GitHub como un commit.
# Solo edita contenido (textos, fotos, listas). El diseño se cambia en el código.

media:
  input: public/img
  output: /img

content:
  - name: tema
    label: Diseño (colores, letras, estilo)
    type: file
    path: src/content/tema.json
    format: json
    fields:
      - name: modo
        label: Modo
        type: select
        options:
          values:
            - name: oscuro
              label: Oscuro (fondo negro)
            - name: claro
              label: Claro (fondo blanco)
      - name: boton_modo
        label: Mostrar botón sol/luna para que cada visitante elija oscuro o claro
        description: El "Modo" de arriba es el que se ve la primera vez.
        type: boolean
        default: true
      - name: paleta
        label: Paleta de colores
        description: Colores probados para que todo se lea bien. Elige "Personalizada" para usar tus propios colores abajo.
        type: select
        options:
          values:
            - name: clasica
              label: Clásica (negro, dorado, beige y gris)
            - name: dorado
              label: Dorado
            - name: champana
              label: Champaña
            - name: bronce
              label: Bronce
            - name: esmeralda
              label: Esmeralda
            - name: lavanda
              label: Lavanda
            - name: plata
              label: Plata
            - name: personalizada
              label: Personalizada
      - name: color_acento
        label: Color de acento (solo con paleta Personalizada)
        description: 'Código de color, por ejemplo #D9B25F. Se usa en botones, títulos pequeños y detalles.'
        type: string
        pattern:
          regex: '^$|^#?[0-9A-Fa-f]{6}$'
          message: 'Usa un código de 6 caracteres, por ejemplo #D9B25F'
      - name: color_fondo
        label: Color de fondo (solo con paleta Personalizada, opcional)
        description: 'Por ejemplo #0A0A0A. Déjalo vacío para usar el del modo elegido.'
        type: string
        pattern:
          regex: '^$|^#?[0-9A-Fa-f]{6}$'
          message: 'Usa un código de 6 caracteres, por ejemplo #0A0A0A'
      - name: fuente_titulos
        label: Tipo de letra de títulos
        type: select
        options:
          values: [Trajan Pro, Montserrat, Poppins, Raleway, DM Sans, Inter, Playfair Display, Cormorant Garamond, Lora, Merriweather]
      - name: fuente_texto
        label: Tipo de letra de párrafos
        type: select
        options:
          values: [Avenir, Source Sans 3, Inter, DM Sans, Poppins, Raleway, Montserrat, Lora, Merriweather]
      - name: fuente_detalles
        label: Tipo de letra de detalles (etiquetas pequeñas y botones)
        type: select
        options:
          values: [ITC Eras, Avenir, Montserrat, Inter, DM Sans, Poppins]
      - name: tamano_texto
        label: Tamaño de letra
        type: select
        options:
          values:
            - name: pequeno
              label: Pequeño
            - name: normal
              label: Normal
            - name: grande
              label: Grande
            - name: muy-grande
              label: Muy grande
      - name: esquinas
        label: Esquinas de botones y tarjetas
        type: select
        options:
          values:
            - name: redondeadas
              label: Redondeadas
            - name: suaves
              label: Suaves
            - name: rectas
              label: Rectas
      - name: animaciones
        label: Animaciones al hacer scroll
        type: boolean
        default: true
      - name: secciones
        label: Secciones visibles en el inicio
        type: object
        fields:
          - name: redes
            label: Sígueme en redes
            type: boolean
            default: true
          - name: palabra
            label: Palabra para hoy
            type: boolean
            default: true
          - name: biografia
            label: Biografía
            type: boolean
            default: true
          - name: trayectoria
            label: Trayectoria en números
            type: boolean
            default: true
          - name: mensajes
            label: Mensajes (YouTube)
            type: boolean
            default: true
          - name: radio
            label: Faro del Espíritu (radio)
            type: boolean
            default: true
          - name: ministerios
            label: Ministerios
            type: boolean
            default: true
          - name: matrimonios
            label: Matrimonios (Congreso Enamorados y Defensores del Pacto)
            type: boolean
            default: true
          - name: invitaciones
            label: Invitaciones y agenda
            type: boolean
            default: true
          - name: horarios
            label: Visítanos (horarios y mapa)
            type: boolean
            default: true
          - name: vida_bendecida
            label: Vida Bendecida
            type: boolean
            default: true
          - name: eventos
            label: Eventos
            type: boolean
            default: true
          - name: testimonios
            label: Testimonios
            type: boolean
            default: true

  - name: inicio
    label: Portada y biografía
    type: file
    path: src/content/inicio.json
    format: json
    fields:
      - name: portada
        label: Portada (lo primero que se ve)
        type: object
        fields:
          - name: etiqueta
            label: Texto pequeño sobre el nombre
            type: string
          - name: nombre
            label: Nombre (título grande)
            type: string
            required: true
          - name: frase
            label: Frase destacada (en dorado)
            type: string
          - name: texto
            label: Descripción
            type: text
          - name: foto
            label: Foto principal
            description: Cuadrada, idealmente 900 × 900 px o más.
            type: image
      - name: biografia
        label: Biografía
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: imagen
            label: Foto
            type: image
          - name: parrafos
            label: Párrafos
            type: text
            list: true
      - name: mision
        label: Frase de misión (cita grande)
        type: text
      - name: mensaje
        label: Sección Mensajes (YouTube)
        type: object
        fields:
          - name: titulo
            label: Etiqueta
            type: string
          - name: texto
            label: Texto
            type: text
          - name: youtube_lista
            label: ID de lista o canal de YouTube
            description: Para los últimos videos del canal, el ID empieza con UU (es el del canal cambiando UC por UU).
            type: string
      - name: palabra
        label: Palabra para hoy
        description: Cámbiala cuando quieras; aparece debajo de las redes.
        type: object
        fields:
          - name: titulo
            label: Etiqueta
            type: string
          - name: texto
            label: Frase o versículo
            type: text
          - name: cita
            label: Cita (ej. Filipenses 1:6)
            type: string
          - name: texto_en
            label: Frase en inglés (opcional, para la versión en inglés)
            type: text
          - name: cita_en
            label: Cita en inglés (ej. Philippians 1:6)
            type: string
      - name: trayectoria
        label: Trayectoria en números
        type: object
        list: true
        fields:
          - name: numero
            label: Número
            type: number
          - name: prefijo
            label: Antes del número (ej. +)
            type: string
          - name: texto
            label: Texto
            type: string
      - name: radio
        label: Faro del Espíritu (radio)
        type: object
        fields:
          - name: titulo
            label: Nombre del programa
            type: string
          - name: texto
            label: Descripción
            type: text
          - name: frecuencia
            label: Frecuencia y horario (opcional, ej. 98.5 FM · lunes a viernes 6 pm)
            type: string
          - name: url
            label: Enlace para escuchar
            type: string
          - name: boton
            label: Texto del botón
            type: string
      - name: matrimonios
        label: Matrimonios
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: texto
            label: Introducción
            type: text
          - name: ministerios
            label: Ministerios
            type: object
            list: true
            fields:
              - name: nombre
                label: Nombre
                type: string
              - name: texto
                label: Descripción
                type: text
              - name: fecha
                label: Próxima fecha (opcional; se oculta sola cuando pasa)
                type: date
              - name: lugar
                label: Lugar (opcional)
                type: string
              - name: boton
                label: Texto del botón de WhatsApp
                type: string

  - name: ministerios
    label: Ministerios
    type: file
    path: src/content/ministerios.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: descripcion
        label: Descripción
        type: text
      - name: imagen
        label: Imagen
        description: Horizontal (16:10). Si se deja vacía se muestran las iniciales.
        type: image
      - name: enlace
        label: Enlace "Conocer más" (opcional)
        type: string

  - name: invitaciones
    label: Invitaciones y agenda
    type: file
    path: src/content/invitaciones.json
    format: json
    fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto de introducción
        type: text
      - name: whatsapp
        label: WhatsApp que recibe las invitaciones (solo números, con código de país)
        type: string
      - name: email
        label: Correo que recibe las invitaciones
        type: string
      - name: tipos
        label: Tipos de invitación
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: texto
            label: Descripción corta
            type: string
          - name: icono
            label: Ícono
            type: select
            options:
              values: [microfono, iglesia, usuarios, audio, calendario, web]
      - name: nota
        label: Nota debajo del formulario
        type: string

  - name: iglesia
    label: Visítanos y transmisión en vivo
    type: file
    path: src/content/iglesia.json
    format: json
    fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
      - name: horarios
        label: Horarios de culto
        type: object
        list: true
        fields:
          - name: dia
            label: Día (ej. Domingo)
            type: string
          - name: horas
            label: Horas (ej. 8:00 am)
            type: string
            list: true
          - name: nota
            label: Nota (ej. Presencial y en vivo)
            type: string
      - name: direccion
        label: Dirección
        type: string
      - name: mapa
        label: Búsqueda para el mapa
        description: Lo que se buscaría en Google Maps para encontrar la iglesia.
        type: string
      - name: en_vivo
        label: Aviso "En vivo"
        type: object
        fields:
          - name: modo
            label: Cuándo mostrarlo
            type: select
            options:
              values:
                - name: automatico
                  label: Automático (durante los horarios de culto)
                - name: encendido
                  label: Siempre (ahora mismo)
                - name: apagado
                  label: Nunca
          - name: texto
            label: Texto del aviso
            type: string
          - name: url
            label: Enlace de la transmisión
            type: string
          - name: duracion_minutos
            label: Minutos que dura cada culto (para el modo automático)
            type: number

  - name: eventos
    label: Eventos
    type: file
    path: src/content/eventos.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: fecha
        label: Fecha
        description: Los eventos pasados se ocultan solos.
        type: date
        required: true
      - name: lugar
        label: Lugar
        type: string
      - name: descripcion
        label: Descripción
        type: text
      - name: enlace
        label: Enlace (opcional)
        type: string

  - name: testimonios
    label: Testimonios
    type: file
    path: src/content/testimonios.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: lugar
        label: Ciudad o iglesia
        type: string
      - name: texto
        label: Testimonio
        type: text
        required: true

  - name: vida-bendecida
    label: Vida Bendecida
    type: file
    path: src/content/vida-bendecida.json
    format: json
    fields:
      - name: imagen
        label: Imagen
        type: image
      - name: intro
        label: Texto de introducción
        type: text
      - name: canales
        label: Canales (WhatsApp, Telegram, YouTube)
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: texto
            label: Descripción
            type: text
          - name: url
            label: Enlace
            type: string
          - name: boton
            label: Texto del botón
            type: string
      - name: redes
        label: Otras redes de Vida Bendecida
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: url
            label: Enlace
            type: string

  - name: ofrenda
    label: Ofrenda y Diezmo
    type: file
    path: src/content/ofrenda.json
    format: json
    fields:
      - name: titulo
        label: Título
        type: string
      - name: intro
        label: Introducción
        type: text
      - name: versiculo
        label: Versículo
        type: object
        fields:
          - name: texto
            label: Texto
            type: string
          - name: cita
            label: Cita (libro capítulo:versículo)
            type: string
      - name: cuentas
        label: Cuentas bancarias
        type: object
        list: true
        fields:
          - name: banco
            label: Banco
            type: string
          - name: titular
            label: Titular (nombre legal del ministerio)
            type: string
          - name: cuenta
            label: Número de cuenta
            type: string
          - name: moneda
            label: Moneda
            type: string
      - name: enLinea
        label: Ofrendar en línea (PayPal u otros)
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre del servicio
            type: string
          - name: url
            label: Enlace
            type: string

  - name: sitio
    label: Contacto y redes
    type: file
    path: src/content/sitio.json
    format: json
    fields:
      - name: nombre
        label: Nombre del sitio
        type: string
      - name: lema
        label: Lema (pie de página)
        type: string
      - name: descripcion
        label: Descripción corta
        type: text
      - name: contacto
        label: Contacto
        type: object
        fields:
          - name: direccion
            label: Dirección
            type: string
          - name: telefono
            label: Teléfono (como se muestra)
            type: string
          - name: whatsapp
            label: WhatsApp (solo números, con código de país)
            type: string
          - name: email
            label: Correo
            type: string
      - name: redes
        label: Redes sociales
        description: Las marcadas como "Acceso rápido" aparecen en la portada y en el botón flotante.
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: usuario
            label: Usuario o texto corto (ej. @natanalfaro)
            type: string
          - name: url
            label: Enlace
            type: string
          - name: icono
            label: Ícono
            type: select
            options:
              values: [whatsapp, facebook, instagram, youtube, x, telegram, audio, correo, web]
          - name: destacada
            label: Acceso rápido
            type: boolean
