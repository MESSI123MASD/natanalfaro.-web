# Panel de edición del sitio (Pages CMS): https://app.pagescms.org
# Cada cambio guardado en el panel se registra en GitHub como un commit.
# Solo edita contenido (textos, fotos, listas). El diseño se cambia en el código.

media:
  input: public/img
  output: /img

content:
  - name: tema
    label: Diseño (colores, letras, estilo)
    type: file
    path: src/content/tema.json
    format: json
    fields:
      - name: modo
        label: Modo
        type: select
        options:
          values:
            - name: oscuro
              label: Oscuro (fondo negro)
            - name: claro
              label: Claro (fondo blanco)
      - name: paleta
        label: Paleta de colores
        description: Colores probados para que todo se lea bien. Elige "Personalizada" para usar tus propios colores abajo.
        type: select
        options:
          values:
            - name: dorado
              label: Dorado (actual)
            - name: champana
              label: Champaña
            - name: bronce
              label: Bronce
            - name: esmeralda
              label: Esmeralda
            - name: lavanda
              label: Lavanda
            - name: plata
              label: Plata
            - name: personalizada
              label: Personalizada
      - name: color_acento
        label: Color de acento (solo con paleta Personalizada)
        description: 'Código de color, por ejemplo #D9B25F. Se usa en botones, títulos pequeños y detalles.'
        type: string
        pattern:
          regex: '^$|^#?[0-9A-Fa-f]{6}$'
          message: 'Usa un código de 6 caracteres, por ejemplo #D9B25F'
      - name: color_fondo
        label: Color de fondo (solo con paleta Personalizada, opcional)
        description: 'Por ejemplo #0A0A0A. Déjalo vacío para usar el del modo elegido.'
        type: string
        pattern:
          regex: '^$|^#?[0-9A-Fa-f]{6}$'
          message: 'Usa un código de 6 caracteres, por ejemplo #0A0A0A'
      - name: fuente_titulos
        label: Tipo de letra de títulos
        type: select
        options:
          values: [Montserrat, Poppins, Raleway, DM Sans, Inter, Playfair Display, Cormorant Garamond, Lora, Merriweather]
      - name: fuente_texto
        label: Tipo de letra de párrafos
        type: select
        options:
          values: [Source Sans 3, Inter, DM Sans, Poppins, Raleway, Montserrat, Lora, Merriweather]
      - name: tamano_texto
        label: Tamaño de letra
        type: select
        options:
          values:
            - name: pequeno
              label: Pequeño
            - name: normal
              label: Normal
            - name: grande
              label: Grande
            - name: muy-grande
              label: Muy grande
      - name: esquinas
        label: Esquinas de botones y tarjetas
        type: select
        options:
          values:
            - name: redondeadas
              label: Redondeadas
            - name: suaves
              label: Suaves
            - name: rectas
              label: Rectas
      - name: animaciones
        label: Animaciones al hacer scroll
        type: boolean
        default: true
      - name: secciones
        label: Secciones visibles en el inicio
        type: object
        fields:
          - name: biografia
            label: Biografía
            type: boolean
            default: true
          - name: ministerios
            label: Ministerios
            type: boolean
            default: true
          - name: vida_bendecida
            label: Vida Bendecida
            type: boolean
            default: true
          - name: eventos
            label: Eventos
            type: boolean
            default: true
          - name: testimonios
            label: Testimonios
            type: boolean
            default: true

  - name: inicio
    label: Portada y biografía
    type: file
    path: src/content/inicio.json
    format: json
    fields:
      - name: portada
        label: Portada (lo primero que se ve)
        type: object
        fields:
          - name: etiqueta
            label: Texto pequeño sobre el título
            type: string
          - name: titulo
            label: Título (parte blanca)
            type: string
            required: true
          - name: titulo_resaltado
            label: Título (parte dorada, al final)
            type: string
          - name: texto
            label: Texto debajo del título
            type: text
          - name: imagen_fondo
            label: Imagen de fondo
            description: Horizontal, idealmente 1920 × 1080 px.
            type: image
      - name: biografia
        label: Biografía
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: imagen
            label: Foto
            type: image
          - name: parrafos
            label: Párrafos
            type: text
            list: true
      - name: mision
        label: Frase de misión (cita grande)
        type: text

  - name: ministerios
    label: Ministerios
    type: file
    path: src/content/ministerios.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: descripcion
        label: Descripción
        type: text
      - name: imagen
        label: Imagen
        description: Horizontal (16:10). Si se deja vacía se muestran las iniciales.
        type: image
      - name: enlace
        label: Enlace "Conocer más" (opcional)
        type: string

  - name: eventos
    label: Eventos
    type: file
    path: src/content/eventos.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: fecha
        label: Fecha
        description: Los eventos pasados se ocultan solos.
        type: date
        required: true
      - name: lugar
        label: Lugar
        type: string
      - name: descripcion
        label: Descripción
        type: text
      - name: enlace
        label: Enlace (opcional)
        type: string

  - name: testimonios
    label: Testimonios
    type: file
    path: src/content/testimonios.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: lugar
        label: Ciudad o iglesia
        type: string
      - name: texto
        label: Testimonio
        type: text
        required: true

  - name: vida-bendecida
    label: Vida Bendecida
    type: file
    path: src/content/vida-bendecida.json
    format: json
    fields:
      - name: imagen
        label: Imagen
        type: image
      - name: intro
        label: Texto de introducción
        type: text
      - name: canales
        label: Canales (WhatsApp, Telegram, YouTube)
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: texto
            label: Descripción
            type: text
          - name: url
            label: Enlace
            type: string
          - name: boton
            label: Texto del botón
            type: string
      - name: redes
        label: Otras redes de Vida Bendecida
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: url
            label: Enlace
            type: string

  - name: ofrenda
    label: Ofrenda y Diezmo
    type: file
    path: src/content/ofrenda.json
    format: json
    fields:
      - name: titulo
        label: Título
        type: string
      - name: intro
        label: Introducción
        type: text
      - name: versiculo
        label: Versículo
        type: object
        fields:
          - name: texto
            label: Texto
            type: string
          - name: cita
            label: Cita (libro capítulo:versículo)
            type: string
      - name: cuentas
        label: Cuentas bancarias
        type: object
        list: true
        fields:
          - name: banco
            label: Banco
            type: string
          - name: titular
            label: Titular (nombre legal del ministerio)
            type: string
          - name: cuenta
            label: Número de cuenta
            type: string
          - name: moneda
            label: Moneda
            type: string
      - name: enLinea
        label: Ofrendar en línea (PayPal u otros)
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre del servicio
            type: string
          - name: url
            label: Enlace
            type: string

  - name: sitio
    label: Contacto y redes
    type: file
    path: src/content/sitio.json
    format: json
    fields:
      - name: nombre
        label: Nombre del sitio
        type: string
      - name: lema
        label: Lema (pie de página)
        type: string
      - name: contacto
        label: Contacto
        type: object
        fields:
          - name: direccion
            label: Dirección
            type: string
          - name: telefono
            label: Teléfono (como se muestra)
            type: string
          - name: whatsapp
            label: WhatsApp (solo números, con código de país)
            type: string
          - name: email
            label: Correo
            type: string
      - name: redes
        label: Redes sociales
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
          - name: url
            label: Enlace
            type: string
